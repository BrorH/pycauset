[build-system]
# pybind11 is pinned to match the CMake FetchContent version (v2.12.0): the
# source is not yet compatible with pybind11 3.x (typing::Tuple return-type
# deduction breaks in bind_vector.cpp). Keep these two in sync.
requires = ["scikit-build-core>=0.3.3", "pybind11==2.12.0", "setuptools_scm"]
build-backend = "scikit_build_core.build"

[project]
name = "pycauset"
dynamic = ["version"]
description = "High-performance Causal Set matrix operations using memory-mapped files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Bror Hjemgaard" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=1.20.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "psutil",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/BrorH/pycauset"
Repository = "https://github.com/BrorH/pycauset"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["python/pycauset"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["python/pycauset/_version.py"]

[tool.setuptools_scm]
write_to = "python/pycauset/_version.py"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
norecursedirs = [
  "build",
  "build_*",
  "_deps",
  ".venv",
  "__pycache__",
  ".git",
  "site",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# Baseline: mechanical, low-risk rules first (pyflakes E/F, import sorting I,
# pyupgrade UP). NumPy-style docstrings (D) are enabled once docstring coverage
# is cleaned up, per R1_POLISH.md.
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.8"
# The native extension (pycauset._pycauset) and optional deps have no stubs;
# ignore missing imports for a permissive baseline.
ignore_missing_imports = true
warn_unused_ignores = false

