name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # pyflakes only (unused names, undefined names): the codebase is clean for it; the other
    # rule groups in pyproject have a backlog (line length, import order) and are not gated.
    name: ruff (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check --select F python tests benchmarks

  docs:
    # The site builds with every link resolved (--strict): a renamed or removed page breaks a
    # PR here instead of the deployed site (docs.yml deploys from main only).
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs full history + tags to detect the version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev gfortran

      - name: Install system OpenBLAS (macOS)
        if: runner.os == 'macOS'
        run: brew install openblas libomp

      - name: Install pycauset with test dependencies
        env:
          # Linux: the engine core builds with warnings as errors (PYCAUSET_WERROR, PLAN 1.8).
          CMAKE_ARGS: ${{ runner.os == 'Linux' && '-DPYCAUSET_WERROR=ON' || '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        timeout-minutes: 10
        # Against the installed package (`-o pythonpath=` drops pyproject's `python/`, which is
        # for source-tree development): CI tests what pip built, without copying the extension
        # into the source tree (F-023). testpaths: tests/engine and tests/blockmatrix.
        run: python -m pytest -o pythonpath= -q --tb=short -rfEs

      - name: Engine suite with lazy results disabled (lazy == eager oracle, LAZY.md section 10)
        env:
          PYCAUSET_LAZY: "0"
        run: python -m pytest -o pythonpath= -q --tb=short -rfEs tests/engine

      - name: Benchmark (parity vs NumPy, report-only)
        # Visibility: this reports the numpy_time/pycauset_time
        # ratio per op (>= 0.90x = "at parity"). It is intentionally report-only,
        # not a hard gate: shared CI runners are noisy and timing thresholds are
        # enforced locally/on a dedicated machine, not on the 3-OS CI matrix.
        run: python benchmarks/parity.py

  cpp-tests:
    # C++ unit tests (gtest): ParallelUtils, MemoryGovernor, IOAccelerator, CoW,
    # CPU worker contract. Built with warnings on.
    name: C++ unit tests · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain and BLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev gfortran ninja-build
          python -m pip install "pybind11==2.12.0"

      - name: Configure
        run: |
          cmake -S . -B build/cpp -G Ninja -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wno-unused-parameter"

      - name: Build
        run: cmake --build build/cpp -j 4

      - name: Run
        run: ctest --test-dir build/cpp --output-on-failure --timeout 120

