name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs full history + tags to detect the version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev gfortran

      - name: Install system OpenBLAS (macOS)
        if: runner.os == 'macOS'
        run: brew install openblas libomp

      - name: Install pycauset with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Deploy native extension into source tree
        # The test suite adds the repo's python/ dir to sys.path and imports the
        # package from there, but pip installs the compiled _pycauset extension and
        # its DLLs into site-packages. Copy the native artifacts next to the source
        # so the tests find them.
        run: python -c "import pycauset, pathlib, shutil; sp = pathlib.Path(pycauset.__file__).parent; dst = pathlib.Path('python/pycauset'); [shutil.copy2(str(f), str(dst / f.name)) for pat in ('*.pyd','*.so','*.dylib','*.dll') for f in sp.glob(pat)]; libs = sp / 'libs'; shutil.copytree(str(libs), str(dst / 'libs'), dirs_exist_ok=True) if libs.exists() else None"

      - name: Run tests
        timeout-minutes: 10
        # testpaths in pyproject: the engine suite (tests/engine), physics smoke tests
        # (tests/physics) and the block-matrix feature (tests/blockmatrix)
        run: python -m pytest -q --tb=short -rfEs

      - name: Engine suite with lazy results disabled (lazy == eager oracle, LAZY.md section 10)
        env:
          PYCAUSET_LAZY: "0"
        run: python -m pytest -q --tb=short -rfEs tests/engine

      - name: Benchmark (parity vs NumPy, report-only)
        # R2_PERF/R2_QA visibility: this reports the numpy_time/pycauset_time
        # ratio per op (>= 0.90x = "at parity"). It is intentionally report-only,
        # not a hard gate: shared CI runners are noisy and timing thresholds are
        # enforced locally/on a dedicated machine, not on the 3-OS CI matrix.
        run: python benchmarks/r2_parity.py

  cpp-tests:
    # C++ unit tests (gtest): ParallelUtils, MemoryGovernor, IOAccelerator, CoW,
    # lazy expressions, op registry, CPU worker contract. Built with warnings on.
    name: C++ unit tests · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain and BLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev gfortran ninja-build
          python -m pip install "pybind11==2.12.0"

      - name: Configure
        run: |
          cmake -S . -B build/cpp -G Ninja -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wno-unused-parameter"

      - name: Build
        run: cmake --build build/cpp -j 4

      - name: Run
        run: ctest --test-dir build/cpp --output-on-failure --timeout 120

